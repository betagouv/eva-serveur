fr:
  question_mise_en_action:
    question: Cette personne a-t-elle reçu de l’aide depuis cette évaluation ?
    description: Votre réponse permet de suivre son accompagnement.
    bouton_oui: Oui
    bouton_non: Non
    bouton_je_ne_sais_pas: Pas encore
    rappel_pas_encore: "Le %{date}, vous aviez répondu « Pas encore ». Où en est l’accompagnement aujourd’hui ?"
