fr:
  question_mise_en_action:
    question: Va-t-elle être orientée vers un dispositif ou une action de formation en lien avec les compétences de base ?
    aide: Votre réponse aide l’ANLCI à identifier les territoires où des solutions adaptées doivent être développées.
    bouton_oui: Oui
    bouton_non: Non
    bouton_pas_encore: Pas encore
    rappel_pas_encore: "Le %{date}, vous aviez répondu « Pas encore ». Où en est l’accompagnement aujourd’hui ?"
